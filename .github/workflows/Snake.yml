name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=%23493024&color_dots=%23F5EBDD,%23E8D8C3,%23D8C1A5,%23A47755,%23493024
            dist/github-snake-dark.svg?color_snake=%23D8C1A5&color_dots=%232B1B14,%23493024,%23735F50,%23A47755,%23D8C1A5

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
